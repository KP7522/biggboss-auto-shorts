name: Daily Bigg Boss Automation

on:
  schedule:
    - cron: '0 18 * * *' # Runs automatically every night at 11:30 PM IST
  workflow_dispatch: # Enables manual run button

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload Video Output
        uses: actions/upload-artifact@v4
        with:
          name: biggboss-daily-short
          path: final_short.mp4
